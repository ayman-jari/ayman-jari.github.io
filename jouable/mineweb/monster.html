<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
      <title>MineWeb</title>
      <link rel="stylesheet" href="css/monster.css">
   </head>

   <body>
      <h1>MineWeb</h1>

      <div id="boitemonster" class="monster">
         <p id="monster"></p>
      </div>

      <div id="actionbox" class="monster">
         <p>Monster life log</p>
      </div>

      <div id = "life_bar"></div>

      <div id = "hunger_bar"></div>

      <ul id="statut">
         <li>Score : 0</li>
         <li>Argent : 0</li>
      </ul>
      
      <nav id="nav0">
         <p>Song</p>
         <label id="togbot">
            <input type="checkbox">
            <span id="son"></span>
          </label>
      </nav>
      
      <nav id="nav1">
         <button id="run">Run</button>
         <button id="fight">Fight</button>
         <button id="work">Work</button>
      </nav>

      <nav id="nav2">
         <button id="sleep">Sleep</button>
         <button id="eat">Eat</button>
         <button id="chorba">Magic potion</button>
         <button id="nether">Nether</button>
      </nav>

      <nav id="nav3">
         <button id="show">Show</button>
         <button id="new">New life</button>
         <button id="kill">Kill</button>
      </nav>


      <script src="js/monster.js"></script>
   </body>
</html>
