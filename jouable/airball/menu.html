<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>AirBall</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="stylesheet" href="css/menu.css" />
</head>

<body>
  <div id="menuContainer">
    <div id="menuMain">
      <h1>AirBall</h1>

      <div id="preview">
        <div class="joueur-apercu">
          <div class="tete-apercu"></div>
        </div>
      </div>

      <h2>Choisis ta couleur</h2>
      <div id="colorOptions">
        <div class="colorOption" data-color="red" style="background-color: red"></div>
        <div class="colorOption" data-color="blue" style="background-color: blue"></div>
        <div class="colorOption" data-color="chartreuse" style="background-color: chartreuse"></div>
        <div class="colorOption" data-color="darkmagenta" style="background-color: darkmagenta"></div>
        <div class="colorOption" data-color="hotpink" style="background-color: hotpink"></div>
      </div>

      <input type="text" id="playerName" placeholder="Entre ton pseudo" maxlength="10" /><br />
      <button id="playBtn" disabled>Jouer</button>
    </div>

    <div id="menuHelp">
      <h2>Commandes</h2>
      <ul>
        <li>
          <span class="key">←</span> <span class="key">→</span> : Se déplacer
        </li>
        <li><span class="key">↑</span> : Sauter</li>
        <li><span class="key">Espace</span> : Tirer</li>
      </ul>
    </div>
  </div>

  <script src="js/menu.js"></script>
</body>

</html>
